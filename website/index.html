<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bring the developer experience of Eve by Vercel to infrastructure you control with Garden’s documented compatible Go runtime." />
    <meta property="og:title" content="Garden — Run Eve on your infrastructure" />
    <meta property="og:description" content="Run Garden’s documented Eve-compatible subset with explicit runtime ownership, durable local sessions, and no hosted Garden service." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Garden — Run Eve on your infrastructure</title>
    <style>
      .boot-fallback {
        opacity: 1;
        transition: opacity 180ms ease-out;
      }

      .garden-booting .boot-fallback {
        visibility: hidden;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-fallback { transition: none; }
      }
    </style>
    <script>
      document.documentElement.classList.add("garden-booting");
      const revealGardenFallback = () => {
        document.documentElement.classList.remove("garden-booting");
      };

      window.addEventListener("error", (event) => {
        if (event.target instanceof HTMLScriptElement || event.error) {
          revealGardenFallback();
        }
      }, true);
      window.addEventListener("unhandledrejection", revealGardenFallback);
    </script>
  </head>
  <body>
    <!--
      THESIS: Garden makes runtime ownership visible; refuse the generic centered SaaS hero and feature-card grid.
      OWN-WORLD: Field-note parchment, forest ink, acid-leaf signals, botanical branching geometry, and precision tool labels.
      STORY: Understand the two honest execution paths, inspect the protocol evidence, then install from source.
      FIRST VIEWPORT: A left-anchored promise shares the frame with a branching runtime specimen; install is the primary action.
      FORM: User-pinned Cultivated systems direction; seed key cultivated-systems-user-pin.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root">
      <main class="boot-fallback mx-auto flex min-h-screen w-full max-w-[52rem] flex-col justify-center px-6 py-16">
        <div class="mb-8 inline-flex items-center gap-2.5 font-display text-[1.1rem] font-bold tracking-[-0.025em]">
          <span class="size-3 rounded-full bg-leaf" aria-hidden="true"></span>
          garden
        </div>
        <h1 class="m-0 max-w-[12ch] font-display text-[clamp(3rem,8vw,5.5rem)] font-[650] leading-[0.95] tracking-[-0.04em] text-ink text-balance">
          Garden did not load.
        </h1>
        <p class="mt-7 max-w-[38rem] text-[1.05rem] leading-[1.65] text-ink-soft text-pretty">
          Reload the page to try again. If it still fails, Garden’s source and
          documentation remain available on GitHub.
        </p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a class="inline-flex min-h-13 items-center justify-center rounded-[var(--radius-sm)] bg-forest px-5 text-sm font-[750] text-paper-bright no-underline" href="/">
            Reload Garden
          </a>
          <a class="inline-flex min-h-13 items-center justify-center rounded-[var(--radius-sm)] px-5 text-sm font-[750] text-forest shadow-[inset_0_0_0_1px_var(--line-strong)]" href="https://github.com/thoriqakbar0/garden">
            Open Garden on GitHub
          </a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
